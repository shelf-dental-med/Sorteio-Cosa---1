<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        img {
            max-width: 350px;
            width: 90%;
            height: auto;
            border-radius: 15px;
            border: 5px ridge rgba(28,110,164,0.07);
        }

        #temporizador {
            margin-top: 20px;
            font-size: 32px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <img src="1.webp" alt="QR Code">

        <div id="temporizador">05:00</div>
    </div>

    <script>
        // TEMPO EM MINUTOS
        let minutos = 2;

        let tempo = minutos * 60;

        const temporizador = document.getElementById("temporizador");

        function atualizarTempo() {

            const min = Math.floor(tempo / 60);
            const seg = tempo % 60;

            temporizador.textContent =
                String(min).padStart(2, "0") +
                ":" +
                String(seg).padStart(2, "0");

            if (tempo <= 0) {
                temporizador.textContent = "00:00";
                clearInterval(intervalo);
                return;
            }

            tempo--;
        }

        atualizarTempo();

        const intervalo = setInterval(atualizarTempo, 1000);
    </script>

</body>
</html>
